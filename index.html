<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astronomy for Kids</title>
<meta name="description" content="An interactive astronomy website for kids: explore the 8 planets, Moon phases, space definitions, and read the full book online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Orbitron:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<header class="nav">
  <a href="#top" class="logo" data-i18n="logo">Astronomy for Kids</a>
  <nav>
    <a href="#planets" data-i18n="navPlanets">Planets</a>
    <a href="#moon" data-i18n="navMoon">Moon</a>
    <a href="#glossary" data-i18n="navDefs">Definitions</a>
    <a href="#pdf" data-i18n="navPdf">Read the PDF</a>
  </nav>
  <div class="tools">
    <button class="lang" data-lang="en" aria-label="English">EN</button>
    <button class="lang" data-lang="fr" aria-label="Français">FR</button>
    <button class="lang" data-lang="ar" aria-label="العربية">عربي</button>
    <button id="music" aria-pressed="false">🎵 <span data-i18n="music">Music</span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-text">
      <h1 data-i18n="heroTitle">Astronomy for Kids</h1>
      <p data-i18n="heroSub"></p>
      <a class="btn" href="#planets" data-i18n="start">Start the journey</a>
    </div>
    <div class="system" id="system" aria-hidden="true"><div class="sun"></div></div>
  </section>

  <section id="planets" class="block">
    <h2 data-i18n="pTitle"></h2>
    <p class="lead" data-i18n="pLead"></p>
    <div class="picker" id="picker" role="tablist"></div>
    <div class="stage">
      <div class="planet-wrap" id="planetWrap"><div class="planet" id="planet"></div></div>
      <div class="info" id="info" aria-live="polite">
        <h3 id="pName"></h3>
        <p class="tag" id="pTag"></p>
        <ul id="pFacts"></ul>
      </div>
    </div>
  </section>

  <section id="moon" class="block alt">
    <h2 data-i18n="mTitle"></h2>
    <p class="lead" data-i18n="mLead"></p>
    <div class="phases" id="phases"></div>
    <p class="phase-text" id="phaseText" aria-live="polite"></p>
  </section>

  <section id="glossary" class="block">
    <h2 data-i18n="gTitle"></h2>
    <input id="search" type="search" data-i18n-ph="search" aria-label="Search">
    <div class="terms" id="terms"></div>
    <p class="empty" id="empty" hidden data-i18n="empty"></p>
  </section>

  <section id="pdf" class="block alt">
    <h2 data-i18n="dTitle"></h2>
    <p class="lead" data-i18n="dLead"></p>
    <iframe class="viewer" src="pdf/astronomy.pdf#view=FitH" title="Astronomy for Kids, part 1"></iframe>
    <p class="note" data-i18n="dNote"></p>
    <p><a class="btn" href="pdf/astronomy.pdf" download data-i18n="dl"></a></p>
  </section>
</main>

<footer data-i18n="foot"></footer>
<audio id="bgm" loop preload="none" src="audio/space.mp3"></audio>
<script src="script.js"></script>
</body>
</html>
